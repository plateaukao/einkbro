name: Build
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17
          cache: gradle
      - name: Check locale strings
        run: python3 scripts/check_locale_strings.py
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17
          cache: gradle
      - name: Decode Keystore
        # tr + -i match the leniency of Node's Buffer.from(..., 'base64'),
        # which the previous action used: ignore whitespace/non-alphabet bytes.
        run: echo "${{ secrets.KEYSTORE }}" | tr -d '[:space:]' | base64 -di > "$RUNNER_TEMP/android_keystore.keystore"
      - name: Build the app
        # assembleReleaseAlt builds the side-by-side `info.plateaukao.einkbro.a` variant
        # alongside the main release; -PuniversalApk applies to both.
        run: ./gradlew assembleRelease assembleReleaseAlt -PuniversalApk -Pandroid.injected.signing.store.file=$RUNNER_TEMP/android_keystore.keystore -Pandroid.injected.signing.store.password=${{ secrets.PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.PASSWORD }}
      - name: Publish snapshot pre-release
        # Rolling pre-release replacing the old CI-artifact "snapshot" downloads:
        # each commit on main recreates the `snapshot` tag/release so the
        # Releases page always offers one up-to-date pre-release build.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snapshot --yes --cleanup-tag || true
          gh release create snapshot \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Snapshot (${GITHUB_SHA:0:7})" \
            --notes "Automated pre-release build of commit ${GITHUB_SHA}. Built from main on every commit; may be unstable." \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            app/build/outputs/apk/release/app-x86_64-release.apk \
            app/build/outputs/apk/release/app-x86-release.apk \
            app/build/outputs/apk/release/app-universal-release.apk \
            app/build/outputs/apk/releaseAlt/app-universal-releaseAlt.apk